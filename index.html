<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invitation!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- WELCOME POP-UP OVERLAY -->
    <div class="overlay" id="welcomeOverlay">
        <div class="overlay-card">
            <h2>You're Invited! 👑</h2>
            <p>You have received an invitation for Zyden's Birthday!</p>

            <div class="profile-image-container-small">
                <img src="image/denden.jpg" alt="Baby's Picture">
            </div>

            <button class="btn-open" id="openBtn">✉️ Open Invitation</button>
        </div>
    </div>

    <!-- VIDEO POP-UP MODAL -->
    <div class="video-modal" id="videoModal">
        <div class="video-modal-content">
            <span class="close-video" id="closeVideoBtn">&times;</span>
            <div class="video-wrapper">
                <!-- PALITAN ang src sa ibaba ng MP4 file name mo o YouTube embed link -->
                <video id="birthdayVideo" controls>
                    <source src="video/zyden.mp4" type="video/mp4">
                    Your browser does not support video.
                </video>
            </div>
        </div>
    </div>

    <!-- BACKGROUND MUSIC AUDIO -->
    <audio id="bgMusic" loop preload="auto">
        <source src="audio/birtday.mp3" type="audio/mpeg">
    </audio>

    <!-- MAIN INVITATION CARD -->
    <div class="card">
        <span class="badge">You're Invited! 👑</span>
        <h1>Zyden's 2nd Birthday</h1>
        
        <p class="subtitle">Come join us as we celebrate our baby boy's birthday! 🎈</p>

        <!-- PICTURE SA GITNA -->
        <div class="profile-section">
            <div class="profile-image-container">
                <img src="image/denden.jpg" alt="Baby's Picture">
            </div>
            
            <!-- MALIIT AT GUMAGALAW NA VIDEO BUTTON -->
            <button class="btn-video-small" id="watchVideoBtn">▶ Watch Video</button>
        </div>

        <div class="details-container">
            <div class="detail-item">
                📅 <span>Date:</span> September 22, 2026
            </div>
            <div class="detail-item">
                ⏰ <span>Time:</span> 3:00 PM Onwards
            </div>
            <div class="detail-item">
                📍 <span>Venue:</span> AMBATA SWIMMING POOL 
            </div>
        </div>

        <!-- Countdown Timer Section -->
        <div class="countdown">
            <div class="time-box">
                <span id="days">00</span>
                <label>Days</label>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <label>Hours</label>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <label>Mins</label>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <label>Secs</label>
            </div>
        </div>

        <!-- GUMAGALAW NA GOOGLE MAPS BUTTON -->
        <button class="btn-location" id="locationBtn">📍 View Location on Google Maps</button>
    </div>

    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
